name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: lab1-color-converter
            app-name: ColorConverter
            main-class: by.bsu.colorconverter.Launcher
            description: "RGB, CMYK and LAB Color Converter"

          - project: lab2-image-info
            app-name: ImageInfo
            main-class: by.bsu.imageinfo.Launcher
            description: "Image file metadata reader"

          - project: lab3-image-processing
            app-name: ImageProcessing
            main-class: by.bsu.imageproc.Launcher
            description: "Thresholding and segmentation"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        run: .\gradlew.bat :${{ matrix.project }}:clean :${{ matrix.project }}:test

      - name: Build application distribution
        run: .\gradlew.bat :${{ matrix.project }}:installDist

      - name: Create Windows installer
        shell: pwsh
        run: |
          $project = "${{ matrix.project }}"
          $lib = "$project\build\install\$project\lib"
          $dest = "$project\build\jpackage"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          jpackage `
            --type exe `
            --name "${{ matrix.app-name }}" `
            --app-version 1.0.0 `
            --input $lib `
            --main-jar "$project-1.0.0.jar" `
            --main-class "${{ matrix.main-class }}" `
            --dest $dest `
            --description "${{ matrix.description }}" `
            --vendor "BSU" `
            --win-menu `
            --win-shortcut

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app-name }}-Windows
          path: ${{ matrix.project }}/build/jpackage/*.exe
